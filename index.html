<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <link rel="stylesheet" href="style.css">
    </head>
<body>
<div class="game-container">
    <h1><span style="color: #fcfbf8;">Welcome</span><span style="color: #f20505;"> to the Game!</span></h1>
    <img src="image/background.png" alt="Game Image" class="game-image">
    <br>
    <h2><span style="color: #fcfbf8;">Adventure Awaits!</span></h2>
    <p><span style="color: #0341f9;">Start your adventure and test your skills in this exciting game. Click the button below to begin!</span></p>
    <button type="button" id="start-button">Start Game</button>
</div>
<div> 
<data id="game-data" value='{"score": 0, "level": 1}'><span style="color: #fcfbf8;">Score:</span> <span style="color: #f20505;">0</span>, <span style="color: #fcfbf8;">Level:</span> <span style="color: #f20505;">1</span></data>
</div>
<div>
<canvas id="game-canvas" width="800" height="600"></canvas>
</div>
</body>
</html>
